name: Render tests

on:
  pull_request:

jobs:
  render-tests:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: spec/Gemfile
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run render specs
        run: bundle exec rspec spec/*_spec.rb